version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: attendance-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mejo2127
      POSTGRES_DB: auth_service_dev
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: